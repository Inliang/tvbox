name: _diag

on:
  push:
    paths:
      - '.github/workflows/_diag.yml'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  UPSTREAM_REPO: FongMi/TV
  UPSTREAM_SHA: ${{ github.event.inputs.upstream_sha || '4512b4c9f82534ff66acfde06ccdd68f35b074f0' }}
  BUILD_TOOLS: "37.0.0"
  PATCHES_OUT: ${{ runner.temp }}/patches-applied.json
  OUT_DIR: ${{ runner.temp }}/jmgo-out

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: echo "env ok: $UPSTREAM_SHA / $BUILD_TOOLS / $PATCHES_OUT / $OUT_DIR"
