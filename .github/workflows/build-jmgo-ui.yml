name: build-jmgo-ui

# UI 改造通道：在官方 FongMi/Release 5.8.7 的 leanback 包基础上，
# 把首页「历史 / 直播 / 搜索 / 推送 / 收藏 / 设置」6 个功能按钮从
# 100dp x 100dp 的正方形（图标在上、文字在下）改成横向长方形
# （图标在左、文字在右、高度 56dp），减少占用的垂直空间。
#
# 官方源码对应文件：app/src/leanback/res/layout/adapter_func.xml
# 仓库无 app 源码，故用 apktool 反编译官方 APK 后替换该 layout 资源再重打包。
#
# 单 Release 合并发布（用户 2026-11-13 要求）：一次构建同时产出 32 位（armeabi-v7a）
# 与 64 位（arm64-v8a）两个 APK，合并到**同一个 Release** 发布，描述把两个架构写在一起。
# 两个产物文件名：JMGO-Compatible-5.8.7-horizontal-ui.apk（32 位，无后缀）与
# JMGO-Compatible-5.8.7-horizontal-ui-arm64.apk（64 位）。
# 上游 5.8.7 同时提供 leanback-armeabi_v7a.apk 与 leanback-arm64_v8a.apk。
#
# 桌面显示名约定（用户 2026-11-13 确立，长期有效）：
#   armeabi_v7a → 「JMGO 兼容版」
#   arm64_v8a   → 「JMGO 兼容版 64位」
# 两个架构的包可能同时装在同一台设备/模拟器上，桌面名必须能一眼区分。
# 改的是 res/values*/strings.xml 的 app_name 与 AndroidManifest.xml 的 android:label。
#
# 包名改造（用户 2026-11-13 要求，长期有效）：把官方 com.fongmi.android.tv
# 改成 com.jmgo.android.tv（见 apps/jmgo/scripts/rename_package.py）。好处是重签版
# 永远不与任何官方 com.fongmi.android.tv 安装包（如 5.6.3）撞包名，
# 根治 INSTALL_FAILED_UPDATE_INCOMPATIBLE（MuMu 错误码 -7）。官方签名版
# build-jmgo.yml 不受影响，仍保持 com.fongmi.android.tv。
#
# ⚠️ 重打包必然重签（非官方签名）：
#   1. 官方 runtime 模块（Python / Node / QuickJS / MPV / BD-J / Thunder）签名校验失效；
#   2. 与官方签名版签名不同，无法覆盖安装，需先卸载旧版再装（记得先记下配置地址）。
#
# 按用户长期规则：默认只创建新 Release / 新 tag，绝不删除或覆盖任何已发布版本。
# 唯一例外：用户**明确点名**某几个具体 Release 要求删除时，才走删除流程（经 API 手动删，
# 不在本 workflow 内）。本 workflow 只负责「新增」合并 Release，不含任何删除动作。
# 合并发布的 tag 用日期形式 jmgo-ui-YYYY-MM-DD（当日重跑需手动改日期或追加后缀避免冲突）。
# 触发：仅 workflow_dispatch。

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPO: FongMi/Release
  UPSTREAM_TAG: '5.8.7'
  OLD_PKG_NAME: 'com.fongmi.android.tv'
  NEW_PKG_NAME: 'com.jmgo.android.tv'
  BUILD_TOOLS: '34.0.0'
  APK_DIR: ${{ github.workspace }}/upstream-apks
  OUT_DIR: ${{ github.workspace }}/jmgo-out
  KEY_PASS: jmgo-compat-2026
  KEY_ALIAS: jmgo

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout tvbox repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android build-tools + apktool
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_HOME:-}" && -z "${ANDROID_SDK_ROOT:-}" ]]; then
            for c in "$HOME/Android/Sdk" "/usr/local/lib/android/sdk" "/opt/android-sdk"; do
              if [[ -d "$c" ]]; then ANDROID_HOME="$c"; break; fi
            done
          fi
          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          export ANDROID_HOME ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME"
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          if [[ ! -x "$BT/apksigner" ]]; then
            SDKM=""
            for c in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                     "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
                     "$ANDROID_HOME/tools/bin/sdkmanager"; do
              [[ -x "$c" ]] && SDKM="$c" && break
            done
            [[ -z "$SDKM" ]] && {
              curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-9862592_latest.zip -o /tmp/cmdtools.zip
              mkdir -p "$ANDROID_HOME/cmdline-tools"
              unzip -q -o /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
              mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
              SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            }
            "$SDKM" --install "build-tools;$BUILD_TOOLS" "platform-tools"
          fi
          test -x "$BT/apksigner"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS_DIR=$BT" >> "$GITHUB_ENV"
          curl -fsSL --retry 3 --retry-delay 5 \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar \
            -o /tmp/apktool.jar
          unzip -l /tmp/apktool.jar >/dev/null 2>&1 || { echo "apktool jar corrupt"; exit 1; }
          echo "build-tools ready: $BT"

      - name: Decode jmgo keystore
        run: |
          set -euo pipefail
          mkdir -p "$APK_DIR" "$OUT_DIR"
          base64 -d "apps/jmgo/keystore/jmgo.p12.b64" > /tmp/jmgo.p12
          test -s /tmp/jmgo.p12

      - name: Resolve keystore credentials
        run: |
          set -euo pipefail
          P12=/tmp/jmgo.p12
          PASS=""
          for c in "$KEY_PASS" "jmgo-compat-2026"; do
            [ -z "$c" ] && continue
            if keytool -list -keystore "$P12" -storetype PKCS12 -storepass "$c" >/tmp/ks.txt 2>/dev/null; then
              PASS="$c"; break
            fi
          done
          [ -z "$PASS" ] && { echo "::error::no valid keystore password"; exit 1; }
          ALIAS=$(grep -E 'PrivateKeyEntry' /tmp/ks.txt | head -1 | sed -E 's/^([^,[:space:]]+),.*/\1/' | tr -d ' ')
          [ -z "$ALIAS" ] && ALIAS=jmgo
          echo "RESIGN_PASS=$PASS" >> "$GITHUB_ENV"
          echo "RESIGN_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "keystore ok; alias=$ALIAS"

      - name: Download official leanback 5.8.7 (both ABIs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$APK_DIR"
          api="https://api.github.com/repos/$UPSTREAM_REPO/releases"
          auth=()
          [[ -n "${GH_TOKEN:-}" ]] && auth=(-H "Authorization: Bearer $GH_TOKEN")
          curl -fsSL --retry 3 --retry-delay 5 -H 'Accept: application/vnd.github+json' \
               "${auth[@]}" "$api/tags/$UPSTREAM_TAG" -o /tmp/meta.json
          for ABI in armeabi_v7a arm64_v8a; do
            ASSET="leanback-${ABI}.apk"
            aid=$(ASSET="$ASSET" python3 -c 'import json,os;d=json.load(open("/tmp/meta.json"));m=[x for x in d["assets"] if x["name"]==os.environ["ASSET"]];print(m[0]["id"] if m else "")')
            [[ -z "$aid" ]] && { echo "::error::asset $ASSET not found in upstream $UPSTREAM_TAG"; exit 1; }
            curl -fL --retry 5 --retry-delay 5 --connect-timeout 30 \
                 -H 'Accept: application/octet-stream' "${auth[@]}" \
                 "$api/assets/$aid" -o "$APK_DIR/$ASSET"
            ls -l "$APK_DIR/$ASSET"
          done

      - name: Patch home function buttons + rebuild + resign (both ABIs)
        run: |
          set -uo pipefail
          BT="$BUILD_TOOLS_DIR"
          mkdir -p "$OUT_DIR"

          # 一次性补丁脚本写到 /tmp，由环境变量 DECODED_DIR / APP_LABEL 驱动，循环内多次调用
          cat > /tmp/patch_func.py <<'PY'
          import glob, sys, os, re

          ROOT = os.environ['DECODED_DIR']
          LABEL = os.environ.get('APP_LABEL', 'JMGO 兼容版')

          # 横向长方形：图标在左、文字在右，高度由 100dp 降到 56dp
          # apktool 反编译后 id 写成 @id/xxx（复用已有资源），不能写成 @+id/xxx，
          # 否则会新建同名资源 ID，代码里的 findViewById(R.id.icon) 可能对不上。
          NEW_TPL = '''<?xml version="1.0" encoding="utf-8"?>
          <androidx.appcompat.widget.LinearLayoutCompat xmlns:android="http://schemas.android.com/apk/res/android"
              android:gravity="center_vertical"
              android:orientation="horizontal"
              android:background="@drawable/selector_item"
              android:focusable="true"
              android:focusableInTouchMode="true"
              android:layout_width="120dp"
              android:layout_height="56dp"
              android:paddingStart="12dp"
              android:paddingEnd="12dp">

              <androidx.appcompat.widget.AppCompatImageView
                  android:id="@@IDPREFIX@@icon"
                  android:layout_width="28dp"
                  android:layout_height="28dp"
                  android:layout_marginEnd="10dp" />

              <com.google.android.material.textview.MaterialTextView
                  android:textSize="18sp"
                  android:textColor="@color/white"
                  android:id="@@IDPREFIX@@text"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content" />

          </androidx.appcompat.widget.LinearLayoutCompat>
          '''

          files = sorted(glob.glob(ROOT + '/res/**/adapter_func.xml', recursive=True))
          if not files:
              print('::error::adapter_func.xml not found under', ROOT)
              for f in sorted(glob.glob(ROOT + '/res/layout*/*.xml'))[:40]:
                  print('  ', f)
              sys.exit(1)
          for f in files:
              old = open(f, encoding='utf-8').read()
              # 前置校验：确认是我们认识的那一版布局，结构不同就中止，不发布坏包。
              # id 形式兼容 @+id/ 与 @id/ 两种（源码 vs apktool 反编译产物）。
              for token in ('id/icon', 'id/text', 'selector_item'):
                  if token not in old:
                      print('::error::unexpected adapter_func.xml in', f, 'missing', token)
                      print(old[:1500])
                      sys.exit(1)
              id_prefix = '@+id/' if '@+id/icon' in old else '@id/'
              new = NEW_TPL.replace('@@IDPREFIX@@', id_prefix)
              assert 'orientation="horizontal"' in new
              assert 'layout_height="56dp"' in new
              print('=== BEFORE', f, '===')
              print(old[:1500])
              open(f, 'w', encoding='utf-8').write(new)
              print('=== AFTER', f, '(id prefix =', id_prefix, ') ===')
              print(new)
          print('patched', len(files), 'layout file(s)')

          # 桌面名：32 位「JMGO 兼容版」，64 位「JMGO 兼容版 64位」
          # 用 lambda 而非替换字符串，避免标签里出现反斜杠时被当成反向引用。
          hits = []
          for f in glob.glob(ROOT + '/res/values*/strings.xml'):
              s = open(f, encoding='utf-8').read()
              new_s, n = re.subn(r'(<string name="app_name"[^>]*>)[^<]*(</string>)',
                                 lambda m: m.group(1) + LABEL + m.group(2), s)
              if n:
                  open(f, 'w', encoding='utf-8').write(new_s)
                  hits.append(f)
          print('app_name ->', LABEL, 'in', hits)

          M = ROOT + '/AndroidManifest.xml'
          if os.path.isfile(M):
              s = open(M, encoding='utf-8').read()
              new_s, n = re.subn(r'(android:label=")[^"]*(")',
                                 lambda m: m.group(1) + LABEL + m.group(2), s)
              open(M, 'w', encoding='utf-8').write(new_s)
              print('manifest label ->', LABEL, 'count:', n)
          PY

          cat > /tmp/strip_attr.py <<'PY'
          import re, sys
          p, attr = sys.argv[1], sys.argv[2]
          s = open(p, encoding='utf-8').read()
          new_s, n = re.subn(r'\s+android:' + re.escape(attr) + r'="[^"]*"', '', s)
          print('removed', n, 'occurrences of', attr, 'in', p)
          open(p, 'w', encoding='utf-8').write(new_s)
          PY

          # arch spec: abi|deliverable|label
          SPECS=(
            "armeabi_v7a|JMGO-Compatible-5.8.7-horizontal-ui.apk|JMGO 兼容版"
            "arm64_v8a|JMGO-Compatible-5.8.7-horizontal-ui-arm64.apk|JMGO 兼容版 64位"
          )
          for spec in "${SPECS[@]}"; do
            IFS='|' read -r ABI DELIVER LABEL <<< "$spec"
            echo "============= building $ABI -> $DELIVER ($LABEL) ============="
            SRC="$APK_DIR/leanback-${ABI}.apk"
            DECODED="/tmp/jmgo_dec_${ABI}"
            rm -rf "$DECODED"; mkdir -p "$DECODED"
            java -jar /tmp/apktool.jar d -f "$SRC" -o "$DECODED" \
              || { echo "::error::apktool decode failed for $ABI"; exit 1; }

            # 包名改造：官方 com.fongmi.android.tv -> com.jmgo.android.tv
            # （脚本处理 manifest package / provider authority / smali 目录与所有引用）
            python3 "${{ github.workspace }}/apps/jmgo/scripts/rename_package.py" \
              --decoded-dir "$DECODED" \
              --old "$OLD_PKG_NAME" --new "$NEW_PKG_NAME" \
              || { echo "::error::package rename failed for $ABI"; exit 1; }

            APP_LABEL="$LABEL" DECODED_DIR="$DECODED" python3 /tmp/patch_func.py \
              || { echo "::error::layout/label patch failed for $ABI"; exit 1; }

            for attempt in 1 2 3 4 5 6; do
              if java -jar /tmp/apktool.jar b "$DECODED" -o /tmp/jmgo-unsigned.apk 2> /tmp/build_err.txt; then
                echo "apktool build ok (attempt $attempt)"; break
              fi
              line=$(grep -E 'attribute android:[A-Za-z_]+ not found' /tmp/build_err.txt | head -1 || true)
              if [[ -z "$line" ]]; then
                echo "::error::apktool build failed for $ABI:"; cat /tmp/build_err.txt; exit 1
              fi
              attr=$(printf '%s\n' "$line" | sed -E 's/.*attribute android:([A-Za-z_]+) not found.*/\1/')
              file=$(printf '%s\n' "$line" | sed -E 's#.*(/tmp/jmgo_dec_[^:]+):[0-9]+:.*#\1#')
              echo "attempt $attempt: stripping android:$attr from $file"
              python3 /tmp/strip_attr.py "$file" "$attr"
            done
            [[ -f /tmp/jmgo-unsigned.apk ]] || { echo "::error::apktool build never succeeded for $ABI"; exit 1; }

            "$BT/zipalign" -p 4 /tmp/jmgo-unsigned.apk /tmp/jmgo-aligned.apk
            SIGN_ARGS=(--ks /tmp/jmgo.p12 --ks-type PKCS12
                       --ks-pass pass:"$RESIGN_PASS" --key-pass pass:"$RESIGN_PASS")
            [[ -n "$RESIGN_ALIAS" ]] && SIGN_ARGS+=(--ks-key-alias "$RESIGN_ALIAS")
            "$BT/apksigner" sign "${SIGN_ARGS[@]}" \
              --out "$OUT_DIR/$DELIVER" /tmp/jmgo-aligned.apk
            ls -l "$OUT_DIR/$DELIVER"
            "$BT/apksigner" verify --print-certs "$OUT_DIR/$DELIVER" | head -8

            # 确认打出来的包确实是所选 ABI（防止误把 32 位包当 64 位发出去）
            echo "=== packaged native ABIs ($ABI) ==="
            python3 -c 'import sys,zipfile,re;z=zipfile.ZipFile(sys.argv[1]);print(sorted({m.group(1) for n in z.namelist() if (m:=re.match(r"lib/([^/]+)/",n))}))' "$OUT_DIR/$DELIVER"

            # 回读编译后的二进制 XML，确认横向布局真的进了 APK
            echo "=== compiled adapter_func.xml attributes ($ABI) ==="
            "$BT/aapt2" dump xmltree "$OUT_DIR/$DELIVER" \
              --file res/layout/adapter_func.xml 2>/dev/null \
              | grep -E 'orientation|layout_width|layout_height|gravity' | head -12 \
              || echo "aapt2 xmltree check skipped"
            if [[ -x "$BT/aapt2" ]]; then
              "$BT/aapt2" dump badging "$OUT_DIR/$DELIVER" 2>/dev/null \
                | grep -i "application-label" || true
              # 确认重签包的新包名已生效（漏改则与官方包撞名，装机会 -7）
              PKG=$("$BT/aapt2" dump badging "$OUT_DIR/$DELIVER" 2>/dev/null \
                | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)
              echo "built package ($ABI): ${PKG:-<unknown>}"
              [[ "$PKG" == "$NEW_PKG_NAME" ]] \
                || { echo "::error::expected package $NEW_PKG_NAME but got $PKG"; exit 1; }
            else
              echo "::warning::aapt2 缺失，跳过包名断言（改名逻辑未经校验）"
            fi
          done

      - name: Prepare date-based release tag
        if: github.event_name == 'workflow_dispatch'
        id: reltag
        run: echo "tag=jmgo-ui-$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Publish combined UI Release (32+64, new tag only, keep all existing)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.reltag.outputs.tag }}
          name: JMGO 兼容版（首页横条按钮·32位+64位）
          fail_on_unmatched_files: true
          body: |
            # JMGO 兼容版 · 首页横条按钮版（32 位 + 64 位合并发布）

            在官方 [FongMi/TV](https://github.com/FongMi/TV) 5.8.7 基础上，
            把首页 **历史 / 直播 / 搜索 / 推送 / 收藏 / 设置** 这 6 个功能按钮从
            `100dp × 100dp` 正方形（图标在上、文字在下）改成
            **`120dp × 56dp` 横向长方形**（图标在左、文字在右），
            垂直占用减少约 44%，给下方海报墙腾出空间。

            桌面显示名按架构区分：**32 位 = `JMGO 兼容版`**，**64 位 = `JMGO 兼容版 64位`**，
            两个架构同时装在同一台设备上也能一眼区分。

            ## 本 Release 同时包含两个架构

            | 架构 | 文件名 | 适用设备 | 桌面显示名 |
            | --- | --- | --- | --- |
            | `armeabi_v7a`（32 位 ARM） | `JMGO-Compatible-5.8.7-horizontal-ui.apk` | 坚果 N1S 4K 等 32 位盒子 | JMGO 兼容版 |
            | `arm64_v8a`（64 位 ARM） | `JMGO-Compatible-5.8.7-horizontal-ui-arm64.apk` | 64 位电视盒子 / 投影仪；MuMu 等只支持 `x86_64 / arm64-v8a / x86`、不带 armeabi-v7a 转译的模拟器 | JMGO 兼容版 64位 |

            - 64 位同为首页横条按钮的完整电视版，**并非仅模拟器可用**。
            - 在 x86 模拟器上装 32 位 ARM 包会报 `INSTALL_FAILED_NO_MATCHING_ABIS`
              （MuMu 界面显示「错误码 -16」），**不是安装包损坏**，换本页 64 位版即可。

            ## 安装前必读

            - ⚠️ **新包名 `com.jmgo.android.tv` 与原官方 `com.fongmi.android.tv`、其它 TVBox 包名
              都不同，可直接共存、互不覆盖**。但**若你上一版装过旧的同名重签版（当时还是
              `com.fongmi.android.tv`）**，需先卸载它再装本版；卸载前记下你的「配置地址」，
              装好后重新导入一次（本地播放记录 / 收藏会清空）。
            - ⚠️ 因已重签（非官方签名），官方 runtime 模块（Python / Node / QuickJS /
              MPV / BD-J / Thunder）与宿主 APK 签名校验不一致，**这些扩展模块会失效**；
              常规直链点播与直播播放不受影响。需要网盘 / Python 爬虫 / 蓝光 BD-J 等完整功能，
              请使用同仓库的「JMGO 兼容版」（官方签名版）。

            ## 版本关系

            这是一个**全新 Release / 全新 tag**，此前已发布的所有版本全部保留、未删除、未覆盖，
            需要回退随时可以下载旧版。包名已改为 **`com.jmgo.android.tv`**，与原官方
            `com.fongmi.android.tv` 及任何其它 TVBox 包名都**不同，可直接共存、互不覆盖**；
            versionName 仍为 `5.8.7`。
          files: |
            ${{ github.workspace }}/jmgo-out/JMGO-Compatible-5.8.7-horizontal-ui.apk
            ${{ github.workspace }}/jmgo-out/JMGO-Compatible-5.8.7-horizontal-ui-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
