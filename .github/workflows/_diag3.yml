name: _diag3

on:
  push:
    paths:
      - '.github/workflows/_diag3.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      PATCHES_OUT: ${{ runner.temp }}/patches-applied.json
      OUT_DIR: ${{ runner.temp }}/jmgo-out
    steps:
      - run: echo "env ok: $PATCHES_OUT / $OUT_DIR"
