name: build-jmgo-resigned

# 增强通道：在官方 FongMi/Release 5.8.7 的 leanback-armeabi_v7a 包基础上，
# 用 apktool 把安装后桌面显示名（launcher label）改为「JMGO 兼容版」后重打包，
# 并用仓库内置 jmgo 密钥重签，发布为一个独立 Release。
# 既有的官方签名版 Release（JMGO 兼容版）保持不动、不删除。
#
# ⚠️ 重要代价：重签后 APK 不再使用官方签名，官方 runtime 模块
# （Python / Node / QuickJS / MPV / BD-J / Thunder）与宿主 APK 的签名校验
# 会不一致而失效；常规直链点播播放通常仍可用。
# 触发：仅 workflow_dispatch（避免每次 push 都跑耗时的 apktool 流程）。

on:
  workflow_dispatch:
    inputs:
      build_resigned:
        description: '构建重签改造版（桌面名改为 JMGO 兼容版）'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

env:
  UPSTREAM_REPO: FongMi/Release
  UPSTREAM_TAG: '5.8.7'
  PKG_NAME: 'com.fongmi.android.tv'
  BUILD_TOOLS: '34.0.0'
  APK_DIR: ${{ github.workspace }}/upstream-apks
  OUT_DIR: ${{ github.workspace }}/jmgo-out
  KEY_PASS: jmgo-compat-2026
  KEY_ALIAS: jmgo

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout tvbox repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android build-tools + apktool
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_HOME:-}" && -z "${ANDROID_SDK_ROOT:-}" ]]; then
            for c in "$HOME/Android/Sdk" "/usr/local/lib/android/sdk" "/opt/android-sdk"; do
              if [[ -d "$c" ]]; then ANDROID_HOME="$c"; break; fi
            done
          fi
          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          export ANDROID_HOME
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME"
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          need_install=0
          [[ ! -x "$BT/apksigner" ]] && need_install=1
          if [[ "$need_install" -eq 1 ]]; then
            SDKM=""
            for c in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                     "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
                     "$ANDROID_HOME/tools/bin/sdkmanager"; do
              [[ -x "$c" ]] && SDKM="$c" && break
            done
            [[ -z "$SDKM" ]] && {
              curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-9862592_latest.zip -o /tmp/cmdtools.zip
              mkdir -p "$ANDROID_HOME/cmdline-tools"
              unzip -q -o /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
              mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
              SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            }
            "$SDKM" --install "build-tools;$BUILD_TOOLS" "platform-tools"
          fi
          test -x "$BT/apksigner"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS_DIR=$BT" >> "$GITHUB_ENV"
          # apktool（反编译 / 重打包）—— 用 3.0.3（自带新版 aapt2 / framework，认识 API35+ 属性如 pageSizeCompat）
          curl -fsSL --retry 3 --retry-delay 5 https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o /tmp/apktool.jar
          test -f /tmp/apktool.jar && unzip -l /tmp/apktool.jar >/dev/null 2>&1 || { echo "apktool jar corrupt"; exit 1; }
          echo "build-tools ready: $BT"

      - name: Decode jmgo keystore
        run: |
          set -euo pipefail
          mkdir -p "$APK_DIR"
          base64 -d "apps/jmgo/keystore/jmgo.p12.b64" > /tmp/jmgo.p12
          test -s /tmp/jmgo.p12
          echo "keystore decoded"

      - name: Download official leanback-armeabi_v7a 5.8.7
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$APK_DIR"
          api="https://api.github.com/repos/$UPSTREAM_REPO/releases"
          auth=()
          [[ -n "${GH_TOKEN:-}" ]] && auth=(-H "Authorization: Bearer $GH_TOKEN")
          curl -fsSL --retry 3 --retry-delay 5 -H 'Accept: application/vnd.github+json' \
               "${auth[@]}" "$api/tags/$UPSTREAM_TAG" -o /tmp/meta.json
          aid=$(python3 -c "import json;d=json.load(open('/tmp/meta.json'));print([x for x in d['assets'] if x['name']=='leanback-armeabi_v7a.apk'][0]['id'])")
          curl -fL --retry 5 --retry-delay 5 --connect-timeout 30 \
               -H 'Accept: application/octet-stream' "${auth[@]}" \
               "$api/assets/$aid" -o "$APK_DIR/leanback-armeabi_v7a.apk"
          ls -l "$APK_DIR/leanback-armeabi_v7a.apk"

      - name: Resolve keystore credentials
        run: |
          set -euo pipefail
          P12=/tmp/jmgo.p12
          PASS=""
          for c in "$KEY_PASS" "jmgo-compat-2026" "jmgo-compat-2026"; do
            [ -z "$c" ] && continue
            if keytool -list -keystore "$P12" -storetype PKCS12 -storepass "$c" >/tmp/ks.txt 2>/dev/null; then
              PASS="$c"; break
            fi
          done
          if [ -z "$PASS" ]; then
            echo "::error::No valid keystore password found among candidates"; exit 1
          fi
          ALIAS=$(grep -E 'PrivateKeyEntry' /tmp/ks.txt | head -1 | sed -E 's/^([^,[:space:]]+),.*/\1/' | tr -d ' ')
          [ -z "$ALIAS" ] && ALIAS=jmgo
          echo "RESIGN_PASS=$PASS" >> "$GITHUB_ENV"
          echo "RESIGN_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "keystore ok; alias=$ALIAS"

      - name: apktool decode + rename launcher label + rebuild (self-healing) + resign
        run: |
          set -uo pipefail
          BT="$BUILD_TOOLS_DIR"
          DECODED=/tmp/jmgo_dec
          java -jar /tmp/apktool.jar d -f "$APK_DIR/leanback-armeabi_v7a.apk" -o "$DECODED" || { echo "::error::apktool decode failed"; exit 1; }
          # 1) 把所有 strings.xml 里的 app_name 改为「JMGO 兼容版」（UTF-8 写回）。
          python3 - <<'PY'
          import re, glob
          hits = []
          for f in glob.glob('/tmp/jmgo_dec/res/values*/strings.xml'):
              s = open(f, encoding='utf-8').read()
              new_s, n = re.subn(
                  r'(<string name="app_name"[^>]*>)[^<]*(</string>)',
                  r'\1JMGO 兼容版\2', s)
              if n:
                  open(f, 'w', encoding='utf-8').write(new_s)
                  hits.append(f)
          print("changed app_name in:", hits)
          PY
          # 2) 兜底：若 manifest 直接写死 label，同步替换。
          M="$DECODED/AndroidManifest.xml"
          if [[ -f "$M" ]]; then
            python3 - "$M" <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()
          new_s, n = re.subn(r'(android:label=")[^"]*(")', r'\1JMGO 兼容版\2', s)
          open(p, 'w', encoding='utf-8').write(new_s)
          print("manifest label replaced:", n)
          PY
          fi
          # 3) 写一次性剥离脚本（顶层 heredoc；循环内只调用它，规避嵌套 heredoc 缩进问题）。
          cat > /tmp/strip_attr.py <<'PY'
          import re, sys
          p, attr = sys.argv[1], sys.argv[2]
          s = open(p, encoding='utf-8').read()
          new_s, n = re.subn(r'\s+android:' + re.escape(attr) + r'="[^"]*"', '', s)
          print("removed", n, "occurrences of", attr, "in", p)
          open(p, 'w', encoding='utf-8').write(new_s)
          PY
          # 4) 重打包；若 aapt2 报“attribute android:XXX not found”，自动剥离该属性后重试（最多 6 次）。
          for attempt in 1 2 3 4 5 6; do
            if java -jar /tmp/apktool.jar b "$DECODED" -o /tmp/jmgo-unsigned.apk 2> /tmp/build_err.txt; then
              echo "apktool build ok (attempt $attempt)"; break
            fi
            line=$(grep -E 'attribute android:[A-Za-z_]+ not found' /tmp/build_err.txt | head -1 || true)
            if [[ -z "$line" ]]; then
              echo "::error::apktool build failed (non-attribute error):"; cat /tmp/build_err.txt; exit 1
            fi
            attr=$(printf '%s\n' "$line" | sed -E 's/.*attribute android:([A-Za-z_]+) not found.*/\1/')
            file=$(printf '%s\n' "$line" | sed -E 's#.*(/tmp/jmgo_dec/[^:]+):[0-9]+:.*#\1#')
            echo "attempt $attempt: stripping android:$attr from $file"
            python3 /tmp/strip_attr.py "$file" "$attr"
          done
          [[ -f /tmp/jmgo-unsigned.apk ]] || { echo "::error::apktool build never succeeded after retries"; exit 1; }
          # 5) 对齐 + 用解析出的 jmgo 密钥重签
          "$BT/zipalign" -p 4 /tmp/jmgo-unsigned.apk /tmp/jmgo-aligned.apk
          SIGN_ARGS=(--ks /tmp/jmgo.p12 --ks-type PKCS12
                     --ks-pass pass:"$RESIGN_PASS" --key-pass pass:"$RESIGN_PASS")
          [[ -n "$RESIGN_ALIAS" ]] && SIGN_ARGS+=(--ks-key-alias "$RESIGN_ALIAS")
          "$BT/apksigner" sign "${SIGN_ARGS[@]}" \
            --out "$OUT_DIR/JMGO-Compatible-5.8.7-resigned.apk" /tmp/jmgo-aligned.apk
          ls -l "$OUT_DIR/JMGO-Compatible-5.8.7-resigned.apk"
          "$BT/apksigner" verify --print-certs "$OUT_DIR/JMGO-Compatible-5.8.7-resigned.apk" | head -8
          # 6) 确认 launcher label 已变
          if [[ -x "$BT/aapt2" ]]; then
            "$BT/aapt2" dump badging "$OUT_DIR/JMGO-Compatible-5.8.7-resigned.apk" 2>/dev/null | grep -i "application-label" || echo "label not found via aapt2"
          elif [[ -x "$BT/aapt" ]]; then
            "$BT/aapt" dump badging "$OUT_DIR/JMGO-Compatible-5.8.7-resigned.apk" 2>/dev/null | grep -i "application-label" || echo "label not found via aapt"
          else
            echo "label check skipped (aapt unavailable)"
          fi

      - name: Publish resigned Release (do not delete existing)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jmgo-resigned-${{ github.run_id }}
          name: JMGO 兼容版（重签·桌面显示 JMGO 兼容版）
          body: |
            # JMGO 兼容版（重签改造版）

            在官方 [FongMi/TV](https://github.com/FongMi/TV) 5.8.7 `leanback-armeabi_v7a` 包基础上，
            用 apktool 把**安装后桌面显示名**改为 **JMGO 兼容版** 后重打包，并用仓库内置 jmgo 密钥重签发布。

            - 安装后在投影仪桌面上显示名：**JMGO 兼容版**
            - ⚠️ 因已重签（非官方签名），官方 runtime 模块（Python / Node / QuickJS / MPV / BD-J / Thunder）
              与宿主 APK 签名校验不一致，**这些扩展模块会失效**；常规直链点播播放通常仍可用。
            - 如需网盘 / Python 爬虫 / 蓝光 BD-J 等完整功能，请使用同仓库另一个
              「JMGO 兼容版」（官方签名·完整功能）版本。
            - 包名仍为 `com.fongmi.android.tv`，versionName `5.8.7`，可覆盖安装。
          files: |
            ${{ github.workspace }}/jmgo-out/JMGO-Compatible-5.8.7-resigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
