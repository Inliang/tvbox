name: build-jmgo

# 坚果 N1S 4K 高亮版兼容版 TVBox 客户端（基于 FongMi/TV 5.8.7）。
# 推送即自动编译产出两个可安装 APK（arm64_v8a / armeabi_v7a），并上传 Artifact + Release。
# 仅在 apps/jmgo/** 或本 workflow 自身变更时触发，避免每次改直播源都重编 Android。

on:
  push:
    paths:
      - "apps/jmgo/**"
      - ".github/workflows/build-jmgo.yml"
  workflow_dispatch: {}

concurrency:
  group: build-jmgo-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM_REPO: FongMi/TV
  UPSTREAM_SHA: 4512b4c9f82534ff66acfde06ccdd68f35b074f0
  ANDROID_HOME: /usr/local/lib/android/sdk
  BUILD_TOOLS: "37.0.0"
  COMPILE_SDK: "37"
  PATCHES_OUT: ${{ runner.temp }}/patches-applied.json
  OUT_DIR: ${{ runner.temp }}/jmgo-out

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout 本仓库
        uses: actions/checkout@v4

      - name: Set up JDK 21 (temurin)
        uses: setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Android SDK（platform-37 / build-tools / NDK / CMake）
        run: |
          set -e
          CS="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$CS" --licenses >/dev/null 2>&1 || true
          install_37() {
            "$CS" "platform-tools" "platforms;android-37" "build-tools;37.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          }
          if install_37; then
            echo "SDK 37 installed"
          else
            echo "::warning::android-37 不可用，回退到 36 并改写版本目录"
            sed -i -E "s/compileSdk = \"[0-9]+\"/compileSdk = \"36\"/; s/targetSdk = \"[0-9]+\"/targetSdk = \"36\"/; s/buildTools = \"[0-9.]+\"/buildTools = \"36.0.0\"/" "${{ github.workspace }}/upstream/gradle/libs.versions.toml" 2>/dev/null || true
            echo "BUILD_TOOLS=36.0.0" >> "$GITHUB_ENV"
            "$CS" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          fi

      - name: 克隆上游源码 @ 固定 SHA
        run: |
          set -e
          git clone --filter=blob:none --no-checkout "https://github.com/$UPSTREAM_REPO.git" upstream \
            || git clone "https://github.com/$UPSTREAM_REPO.git" upstream
          cd upstream
          git checkout -f "$UPSTREAM_SHA" \
            || { git fetch origin "$UPSTREAM_SHA"; git checkout -f "$UPSTREAM_SHA"; }

      - name: 应用兼容性补丁（P-00/P-01 必需，P-03 可选）
        env:
          UPSTREAM_DIR: ${{ github.workspace }}/upstream
        run: python apps/jmgo/scripts/apply-patches.py

      - name: 准备固定签名密钥
        run: bash apps/jmgo/scripts/gen-keystore.sh

      - name: 注入 local.properties 到上游
        run: cp apps/jmgo/keystore/local.properties upstream/local.properties

      - name: 编译 leanback release（双 ABI）
        working-directory: upstream
        run: |
          set -e
          sed -i 's/-Xmx2048m/-Xmx4096m/' gradle.properties
          chmod +x gradlew
          ./gradlew :app:assembleLeanbackRelease -PtvRuntimeCatalog= \
            -Dorg.gradle.configuration-cache=false -Dorg.gradle.jvmargs=-Xmx4096m --no-daemon

      - name: 收集并静态校验产物
        env:
          UP: ${{ github.workspace }}/upstream
          BUILD_TOOLS: ${{ env.BUILD_TOOLS }}
        run: |
          bash apps/jmgo/scripts/collect-apk.sh "$UP" "$OUT_DIR"
          cp "$PATCHES_OUT" "$OUT_DIR/patches-applied.json"

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-jmgo-5.8.7
          path: ${{ runner.temp }}/jmgo-out/*
          if-no-files-found: error

      - name: 发布 Release（仅 push 到 main）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jmgo-${{ github.run_id }}
          name: JMGO 兼容版 5.8.7 (run ${{ github.run_id }})
          files: |
            ${{ runner.temp }}/jmgo-out/tvbox-jmgo-leanback-arm64_v8a-5.8.7-*.apk
            ${{ runner.temp }}/jmgo-out/tvbox-jmgo-leanback-armeabi_v7a-5.8.7-*.apk
            ${{ runner.temp }}/jmgo-out/SHA256SUMS.txt
            ${{ runner.temp }}/jmgo-out/build-info.json
            ${{ runner.temp }}/jmgo-out/patches-applied.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
