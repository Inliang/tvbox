name: build-jmgo

# 聚合官方 FongMi/Release 5.8.7 的 4 个已编译完整包，逐包机械校验后，
# 仅发布「JMGO 兼容版」单一可用 APK（leanback / armeabi-v7a 32 位版）。
# 本工作流不产出源码编译产物：上游 FongMi/TV 依赖从未开源的私有 media3 类，
# 源码重建路线已证伪。产物沿用官方原签名，未做任何二进制改造。
# 触发：push 到 apps/jmgo/** 或本文件；也可在 Actions 页 workflow_dispatch。

on:
  push:
    paths:
      - 'apps/jmgo/**'
      - '.github/workflows/build-jmgo.yml'
  workflow_dispatch:
    inputs:
      enable_compat_patch:
        description: '实验通道：二进制兼容补丁（本轮不启用，待 TECH-VERDICT）'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: build-jmgo
  cancel-in-progress: false

env:
  UPSTREAM_REPO: FongMi/Release
  UPSTREAM_TAG: '5.8.7'
  SOURCE_URL_PREFIX: 'https://github.com/FongMi/Release/releases/download/5.8.7/'
  PKG_NAME: 'com.fongmi.android.tv'
  BUILD_TOOLS: '34.0.0'
  APK_DIR: ${{ github.workspace }}/upstream-apks
  OUT_DIR: ${{ github.workspace }}/jmgo-out
  VERIFY_SCRIPT: apps/jmgo/scripts/verify-upstream.py
  DELIVERABLE: JMGO-Compatible-5.8.7.apk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tvbox repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17 (apksigner / aapt2)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve short sha
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA::7}"
          echo "SHORT_SHA=$SHORT" >> "$GITHUB_ENV"
          echo "commit=$GITHUB_SHA short=$SHORT"

      - name: Prepare Android build-tools 34.0.0
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_HOME:-}" && -z "${ANDROID_SDK_ROOT:-}" ]]; then
            for c in "$HOME/Android/Sdk" "/usr/local/lib/android/sdk" "/opt/android-sdk"; do
              if [[ -d "$c" ]]; then ANDROID_HOME="$c"; break; fi
            done
          fi
          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          export ANDROID_HOME
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME"
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"

          need_install=0
          if [[ ! -x "$BT/apksigner" ]]; then need_install=1; fi
          if [[ ! -x "$BT/aapt2" && ! -x "$BT/aapt" ]]; then need_install=1; fi
          if [[ "$need_install" -eq 1 ]]; then
            SDKM=""
            for c in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                     "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
                     "$ANDROID_HOME/tools/bin/sdkmanager"; do
              if [[ -x "$c" ]]; then SDKM="$c"; break; fi
            done
            if [[ -z "$SDKM" ]]; then
              echo "runner 未预装 sdkmanager，下载 commandline-tools 兜底"
              curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-9862592_latest.zip -o /tmp/cmdtools.zip
              mkdir -p "$ANDROID_HOME/cmdline-tools"
              unzip -q -o /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
              if [[ -d "$ANDROID_HOME/cmdline-tools/cmdline-tools" && ! -d "$ANDROID_HOME/cmdline-tools/latest" ]]; then
                mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
              fi
              SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            fi
            if ! yes | "$SDKM" --licenses >/dev/null 2>&1; then
              echo "sdkmanager --licenses 返回非 0（多为已接受或管道 SIGPIPE），继续由 --install 与 test -x 判定"
            fi
            "$SDKM" --install "build-tools;$BUILD_TOOLS" "platform-tools"
          fi

          test -x "$BT/apksigner"
          if [[ ! -x "$BT/aapt2" && ! -x "$BT/aapt" ]]; then
            echo "aapt2 与 aapt 均缺失，无法读取 badging" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS_DIR=$BT" >> "$GITHUB_ENV"
          echo "build-tools ready: $BT"

      - name: Download 4 official 5.8.7 assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$APK_DIR" "$OUT_DIR"
          meta="$OUT_DIR/release-meta.json"
          tsv="$OUT_DIR/assets.tsv"
          api="https://api.github.com/repos/$UPSTREAM_REPO/releases"

          # github.com/.../releases/download/ 通道在 CI 连续下载多个大文件时会 504：
          # 首次运行第 1 个包成功、第 2 个包起 4 次重试全 504。改用 GitHub API 的
          # release assets endpoint（302 到 release-assets.githubusercontent.com），
          # 仍固定 tag 5.8.7 与 4 个固定文件名，禁止回退其它版本；原下载页保留作回退。
          auth=()
          if [[ -n "${GH_TOKEN:-}" ]]; then auth=(-H "Authorization: Bearer $GH_TOKEN"); fi
          if ! curl -fsSL --retry 3 --retry-delay 5 -H 'Accept: application/vnd.github+json' \
               "${auth[@]}" "$api/tags/$UPSTREAM_TAG" -o "$meta"; then
            echo "带 token 读取 release 元数据失败，改匿名重试"
            curl -fsSL --retry 3 --retry-delay 5 -H 'Accept: application/vnd.github+json' \
               "$api/tags/$UPSTREAM_TAG" -o "$meta"
          fi

          # 逐字校验 tag / 4 个 asset 的名称、state、精确字节数，输出 name<TAB>id<TAB>size。
          python3 - "$meta" > "$tsv" <<'PY'
          import json, sys
          expected = {
              "leanback-arm64_v8a.apk": 51412139,
              "leanback-armeabi_v7a.apk": 44768123,
              "mobile-arm64_v8a.apk": 51326563,
              "mobile-armeabi_v7a.apk": 44682547,
          }
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if data.get("tag_name") != "5.8.7":
              sys.exit("tag_name 不是 5.8.7: %r" % (data.get("tag_name"),))
          assets = {a["name"]: a for a in data.get("assets", [])}
          rows = []
          for name, size in expected.items():
              a = assets.get(name)
              if not a:
                  sys.exit("官方 release 缺少 asset: " + name)
              if a.get("state") != "uploaded":
                  sys.exit("asset 未就绪 %s: %r" % (name, a.get("state")))
              if a["size"] != size:
                  sys.exit("asset 字节数异常 %s: %s != %s" % (name, a["size"], size))
              rows.append("%s\t%s\t%s" % (name, a["id"], size))
          # 二进制 stdout 写纯 LF：Windows Python 的 text stdout 会把 \n 转成 \r\n，
          # 使 shell read 出的 size 尾部带 \r，后续 -ne 算术比较会静默失效。
          sys.stdout.buffer.write(("\n".join(rows) + "\n").encode("utf-8"))
          PY
          [[ "$(wc -l < "$tsv")" -eq 4 ]] || { echo "asset 清单不是 4 行"; exit 1; }

          download_one() {
            local asset="$1" aid="$2" expected="$3"
            local tmp="$APK_DIR/.$asset.part" dest="$APK_DIR/$asset"
            rm -f "$tmp"
            echo "::group::download ${asset}"
            if ! curl -fL --retry 5 --retry-delay 5 --connect-timeout 30 \
                 -H 'Accept: application/octet-stream' "${auth[@]}" \
                 -o "$tmp" "$api/assets/$aid"; then
              echo "API assets 通道失败，回退官方下载页: $asset"
              curl -fL --retry 5 --retry-delay 5 --connect-timeout 30 \
                 -o "$tmp" "${SOURCE_URL_PREFIX}${asset}"
            fi
            # 双保险清理非数字字符（CR / 空白），保证 -ne 算术比较在任何 shell 下真正生效。
            local actual; actual=$(wc -c < "$tmp" | tr -d '[:space:]')
            expected="${expected//[^0-9]/}"
            if [[ "$actual" -ne "$expected" ]]; then
              echo "SIZE MISMATCH: $asset expected=$expected actual=$actual" >&2
              return 1
            fi
            mv "$tmp" "$dest"
            echo "$actual bytes  $asset"
            echo "::endgroup::"
          }

          while IFS=$'\t' read -r asset aid expected; do
            download_one "$asset" "$aid" "$expected"
          done < "$tsv"
          rm -f "$meta" "$tsv"
          ls -l "$APK_DIR"

      - name: Mechanical verification (upstream-verify.json)
        run: |
          set -euo pipefail
          # 任一断言失败 -> 脚本非零退出 -> set -e 终止构建，并打印失败包名与原因。
          python3 "$VERIFY_SCRIPT" verify \
            --apk-dir "$APK_DIR" \
            --out "$OUT_DIR/upstream-verify.json" \
            --android-home "$ANDROID_HOME" \
            --build-tools "$BUILD_TOOLS_DIR"

      - name: Rename and prepare JMGO 兼容版 single-apk delivery
        run: |
          set -euo pipefail
          python3 "$VERIFY_SCRIPT" package \
            --apk-dir "$APK_DIR" \
            --out-dir "$OUT_DIR" \
            --verify-json "$OUT_DIR/upstream-verify.json" \
            --short "$SHORT_SHA" \
            --tag "$UPSTREAM_TAG" \
            --run-id "$GITHUB_RUN_ID" \
            --commit-sha "$GITHUB_SHA"
          ( cd "$OUT_DIR" && sha256sum -c SHA256SUMS.txt )
          # 仅保留能用的 1 个：leanback / armeabi-v7a（32 位），改名为 JMGO-Compatible-5.8.7.apk 发布。
          # 只用 ASCII 文件名，规避 CI 非 UTF-8 locale 对中文文件名的截断；APK 字节与官方原签名不变。
          cp -f "$OUT_DIR/tvbox-jmgo-leanback-armeabi_v7a-$UPSTREAM_TAG-$SHORT_SHA.apk" \
                "$OUT_DIR/$DELIVERABLE"
          ls -l "$OUT_DIR/$DELIVERABLE"

      - name: Assert deliverable manifest is complete
        run: |
          set -euo pipefail
          TARGET="$OUT_DIR/$DELIVERABLE"
          if [[ ! -f "$TARGET" ]]; then
            echo "MISSING DELIVERABLE: $TARGET" >&2
            exit 1
          fi
          if [[ ! -s "$TARGET" ]]; then
            echo "EMPTY DELIVERABLE: $TARGET" >&2
            exit 1
          fi
          echo "deliverable manifest OK: $TARGET"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jmgo-compatible
          path: |
            ${{ github.workspace }}/jmgo-out/${{ env.DELIVERABLE }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jmgo-${{ github.run_id }}
          name: JMGO 兼容版
          body: |
            # JMGO 兼容版

            适配 **坚果 N1S 4K 高亮版 / K310 / Android 11 / MT9667 / 32 位系统** 的 TVBox 兼容客户端。

            - 基于 [FongMi/TV](https://github.com/FongMi/TV) 5.8.7 官方发布包，**未修改任何字节、沿用官方原签名**
            - 仅包含 `leanback` 版 `armeabi-v7a`（32 位）安装包，已在本机（坚果 N1S）实测可装、可覆盖升级、较稳定
            - 包名 `com.fongmi.android.tv`，versionName 5.8.7，可 `adb install -r` 覆盖现装官方包，数据保留
            - 兼容性说明：本版**不承诺**修复「切换播放源偶发退回首页」的历史问题，仅做官方包聚合与适配分发

            > 来源：https://github.com/FongMi/Release/releases/download/5.8.7/
            > 文件名 `JMGO-Compatible-5.8.7.apk`（即官方 `leanback-armeabi_v7a` 包，仅改名，未改动字节与原签名）
          files: |
            ${{ github.workspace }}/jmgo-out/${{ env.DELIVERABLE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Experimental compat patch channel (placeholder)
        # 本轮不读取开关值执行重打包：无论 dispatch 是否开启，都只打印占位状态。
        # 待 TECH-VERDICT 落地后再接入 apktool；此处不实现任何二进制改造。
        env:
          REQUESTED: "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.enable_compat_patch || 'false' }}"
        run: |
          set -euo pipefail
          echo "enable_compat_patch requested=$REQUESTED"
          echo "compat patch disabled (pending TECH-VERDICT)"
