name: build-jmgo

# 坚果 N1S 4K 高亮版兼容版 TVBox 客户端（基于 FongMi/TV 5.8.7）。
# 推送 apps/jmgo/** 或本文件即触发；也可在 Actions 页手动 workflow_dispatch。
# 产物：tvbox-jmgo-leanback-arm64_v8a / armeabi_v7a 两个 APK + 校验文件。

on:
  push:
    paths:
      - 'apps/jmgo/**'
      - '.github/workflows/build-jmgo.yml'
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: 'FongMi/TV commit to build (default pinned)'
        required: false
        default: '4512b4c9f82534ff66acfde06ccdd68f35b074f0'

permissions:
  contents: write

concurrency:
  group: build-jmgo
  cancel-in-progress: false

env:
  UPSTREAM_REPO: FongMi/TV
  UPSTREAM_SHA: ${{ github.event.inputs.upstream_sha || '4512b4c9f82534ff66acfde06ccdd68f35b074f0' }}
  BUILD_TOOLS: "37.0.0"
  PATCHES_OUT: ${{ github.workspace }}/patches-applied.json
  OUT_DIR: ${{ github.workspace }}/jmgo-out

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout tvbox repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Android SDK (manual install)
        run: |
          set -e
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-9862592_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" --update >/dev/null 2>&1 || true
          for pkg in "platform-tools" "platforms;android-37" "build-tools;37.0.0" "ndk;28.2.13676358" "cmake;3.22.1"; do
            for attempt in 1 2 3; do
              if yes | "$SDKMANAGER" "$pkg"; then break; fi
              echo "retry $pkg (attempt $attempt)"; sleep 15
            done
          done
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Clone pinned upstream
        run: |
          git clone -c advice.detachedHead=false --filter=blob:none --no-checkout \
            "https://github.com/$UPSTREAM_REPO.git" "$RUNNER_TEMP/upstream" \
            || git clone -c advice.detachedHead=false "https://github.com/$UPSTREAM_REPO.git" "$RUNNER_TEMP/upstream"
          cd "$RUNNER_TEMP/upstream"
          git fetch --depth 1 origin "$UPSTREAM_SHA" || git fetch origin "$UPSTREAM_SHA"
          git checkout -q FETCH_HEAD
          echo "UPSTREAM_DIR=$RUNNER_TEMP/upstream" >> "$GITHUB_ENV"

      - name: 准备固定签名密钥（仓库内置 b64 -> JKS）
        run: bash apps/jmgo/scripts/gen-keystore.sh

      - name: 应用兼容性补丁（P-00/P-01 必需，P-03 可选）
        env:
          UPSTREAM_DIR: ${{ env.UPSTREAM_DIR }}
        run: python apps/jmgo/scripts/apply-patches.py

      - name: 注入 local.properties 到上游
        run: cp apps/jmgo/keystore/local.properties "$UPSTREAM_DIR/local.properties"

      - name: 编译 leanback release（双 ABI）
        working-directory: ${{ env.UPSTREAM_DIR }}
        run: |
          set -e
          sed -i 's/-Xmx2048m/-Xmx4096m/' gradle.properties
          chmod +x gradlew
          ./gradlew :app:assembleLeanbackRelease -PtvRuntimeCatalog= \
            -Dorg.gradle.configuration-cache=false -Dorg.gradle.jvmargs=-Xmx4096m --no-daemon

      - name: 收集并静态校验产物
        env:
          UP: ${{ env.UPSTREAM_DIR }}
          BUILD_TOOLS: ${{ env.BUILD_TOOLS }}
        run: |
          bash apps/jmgo/scripts/collect-apk.sh "$UP" "$OUT_DIR"
          cp "$PATCHES_OUT" "$OUT_DIR/patches-applied.json"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-jmgo-5.8.7
          path: |
            ${{ github.workspace }}/jmgo-out/*.apk
            ${{ github.workspace }}/jmgo-out/SHA256SUMS.txt
            ${{ github.workspace }}/jmgo-out/build-info.json
            ${{ github.workspace }}/jmgo-out/patches-applied.json
          if-no-files-found: error

      - name: Publish GitHub Release (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jmgo-${{ github.run_id }}
          name: JMGO 兼容版 5.8.7 (run ${{ github.run_id }})
          files: |
            ${{ github.workspace }}/jmgo-out/tvbox-jmgo-leanback-arm64_v8a-5.8.7-*.apk
            ${{ github.workspace }}/jmgo-out/tvbox-jmgo-leanback-armeabi_v7a-5.8.7-*.apk
            ${{ github.workspace }}/jmgo-out/SHA256SUMS.txt
            ${{ github.workspace }}/jmgo-out/build-info.json
            ${{ github.workspace }}/jmgo-out/patches-applied.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
